[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "minicode"
version = "0.1.0"
description = "A small, testable coding agent foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
minicode = "minicode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

